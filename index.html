<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Su gimtadieniu Auguste!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <section class="stage">
      <h1 id="title-display">Su gimtadieniu Auguste!</h1>
      <div class="wheel-wrap">
        <canvas id="wheel" aria-label="Spinning wheel, click to spin"></canvas>
      </div>
      <button id="spin" type="button">Atidaryk savo dovaną!</button>
      <div id="result" class="result" aria-live="polite"></div>
    </section>
  </main>

  <script src="wheel.js"></script>
  <script src="app.js"></script>
</body>
</html>
